name: build

# Every push: test the core on Linux, then test and build the app on macOS and keep it as a
# workflow artifact. A push to main also publishes the app as a GitHub release
# (v1.0.<run number>, MachinePromptsMan.zip), which is what install.sh and the menu's
# "Check for Updates…" download.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The engine (MPMCore), on Linux: cheap and quick.
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: swift test

  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test
        run: swift test
      - name: Build the app
        # The branch name goes in through the environment, never pasted into the script: a ref
        # name may contain $( ) or ; and would otherwise run as shell.
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          UNIVERSAL=1 scripts/make-app.sh
      - name: Launches
        run: |
          build/MachinePromptsMan.app/Contents/MacOS/MachinePromptsMan --help
          lipo -info build/MachinePromptsMan.app/Contents/MacOS/MachinePromptsMan
          /usr/libexec/PlistBuddy -c 'Print MPMCommit' build/MachinePromptsMan.app/Contents/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: MachinePromptsMan
          path: build/MachinePromptsMan.zip
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run keeps its run number, so the release may already exist: replace its zip.
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" build/MachinePromptsMan.zip --clobber
          else
            gh release create "v$VERSION" build/MachinePromptsMan.zip --target "$GITHUB_SHA" \
              --title "Machine Prompts Man $VERSION" --notes "$(git log -1 --format=%B)"
          fi
